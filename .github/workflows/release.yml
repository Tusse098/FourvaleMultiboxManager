# Builds a release when a version tag (v1.2.3) is pushed, and creates it as a DRAFT on the Releases page.
# Nothing is public until a person opens the draft, checks it and clicks Publish.
# Steps for making a release: docs/development.md, "Making a release".
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the draft release and upload the zip

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Tests, self-contained publish, zip and checksum: the same script as on a developer PC.
      # Stops if the tag and <Version> in Multibox.App.csproj differ.
      - name: Test and build the zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./tools/scripts/publish.ps1 -ExpectedVersion $version

      # bash: plain, predictable argument passing to gh. The tag comes in through env, not pasted into the script.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          zip="artifacts/FourvaleMultibox-${version}-win-x64.zip"
          # Upper case, as Get-FileHash prints it, so players can compare by eye.
          hash=$(cut -d' ' -f1 "${zip}.sha256" | tr 'a-f' 'A-F')
          sed -e "s/{VERSION}/${version}/g" -e "s/{SHA256}/${hash}/g" .github/release-notes.md > release-notes.tmp.md
          # A normal release becomes "Latest" (sidebar badge, /releases/latest link). Only a test version with a
          # suffix, e.g. v1.1.0-test1 (and <Version>1.1.0-test1</Version>), is marked as a pre-release.
          if [[ "$version" == *-* ]]; then kind=--prerelease; else kind=--latest; fi
          set -x # print the exact command in the log
          gh release create "$TAG" "$zip" "${zip}.sha256" --draft "$kind" --title "$TAG" \
            --notes-file release-notes.tmp.md --generate-notes --verify-tag
